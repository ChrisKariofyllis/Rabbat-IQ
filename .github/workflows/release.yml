name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') }}
          generate_release_notes: true
          body: |
            Pull the image and restart:

            ```bash
            docker compose pull && docker compose up -d
            ```

            Pin this tag with `ghcr.io/chriskariofyllis/rabbat-iq:${{ github.ref_name }}`. Your SQLite database stays in the `rabbat-iq-data` volume. Open http://127.0.0.1:8000.
